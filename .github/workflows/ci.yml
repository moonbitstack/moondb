name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # The moondb interface at the repo root: it compiles and tests on every
  # backend, on three OSes.
  moondb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    name: moondb (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skill into a project, so they
      # have to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # The SQLite driver links the vendored amalgamation, so it is native-only; it
  # still builds on all three OSes.
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    name: moonsqlite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: drivers/sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target native --deny-warn

      - name: moon build
        run: moon build --target native

      - name: moon test (native, real SQLite)
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # End-to-end: the published ORM plus the published SQLite driver, driven against
  # a real SQLite file. It resolves its dependencies from mooncakes, so it runs
  # after those versions are published. Native-only (moonsqlite links C).
  # The PostgreSQL driver's real round trip runs on native and wasm against a
  # live postgres:16. Service containers are Linux-only, so this job is ubuntu-only.
  postgres:
    name: moonpostgres (native + wasm, live PostgreSQL)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
          # scram-sha-256 is postgres 14+'s default, so the round trip exercises
          # the SASL/SCRAM handshake for real rather than the trust shortcut.
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (native and wasm, against live PostgreSQL)
        env:
          MOON_PG_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: test
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # The MySQL driver's integration test runs against a real MySQL 8 on native and
  # wasm, pinned to mysql_native_password so this round's SHA1-scramble handshake
  # authenticates. GitHub service containers cannot append server flags, so we run
  # the container directly and health-gate it.
  mysql:
    name: moonmysql (native + wasm, live MySQL 8)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/mysql
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start mysql 8
        run: |
          docker run -d --name mysql8 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -e MYSQL_DATABASE=test \
            -p 3306:3306 \
            mysql:8.0 --default-authentication-plugin=mysql_native_password

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for mysql
        run: |
          # `mysqladmin ping` answers from the temporary server the image runs
          # while it initialises, and the real server restarts after that. So
          # wait on the query itself: it is the first thing that is true only
          # once the server is actually serving.
          for i in $(seq 1 60); do
            if docker exec mysql8 mysql -uroot -proot -e "SELECT VERSION();" 2>/dev/null; then
              echo "mysql is up"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "mysql never came up"; exit 1

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (codec on all backends + live MySQL on native and wasm)
        env:
          MYSQL_TEST: "1"
          MYSQL_TLS_TEST: "1"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"
          MYSQL_DB: "test"
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # MySQL 8's own default plugin is caching_sha2_password. A fresh container has an
  # empty auth cache, so the very first connection always performs full auth — the
  # RSA public-key exchange + OAEP path — which this job exercises end to end.
  mysql-caching-sha2:
    name: moonmysql (caching_sha2 full auth, live MySQL 8)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/mysql
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start mysql 8 (default caching_sha2_password)
        run: |
          docker run -d --name mysql8cs \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -e MYSQL_DATABASE=test \
            -p 3306:3306 \
            mysql:8.0 --default-authentication-plugin=caching_sha2_password

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for mysql
        run: |
          # `mysqladmin ping` answers from the temporary server the image runs
          # while it initialises, and the real server restarts after that. So
          # wait on the query itself: it is the first thing that is true only
          # once the server is actually serving.
          for i in $(seq 1 60); do
            if docker exec mysql8cs mysql -uroot -proot -e "SELECT VERSION(); SELECT plugin FROM mysql.user WHERE user='root' LIMIT 1;" 2>/dev/null; then
              echo "mysql is up"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "mysql never came up"; exit 1

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (native round trip authenticating via caching_sha2 full auth)
        env:
          MYSQL_TEST: "1"
          MYSQL_TLS_TEST: "1"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"
          MYSQL_DB: "test"
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # MariaDB speaks the MySQL wire protocol, so the SAME integration suite must be
  # green against it. We start MariaDB the same container way (no
  # --default-authentication-plugin: MariaDB has no such flag and already defaults
  # to mysql_native_password) and run against both a current and an LTS release.
  mariadb:
    name: moonmysql (native, live MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["11", "10.11"]
    defaults:
      run:
        working-directory: drivers/mysql
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start mariadb ${{ matrix.mariadb }}
        run: |
          docker run -d --name mariadb \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -e MARIADB_DATABASE=test \
            -p 3306:3306 \
            mariadb:${{ matrix.mariadb }}

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for mariadb
        run: |
          # `mariadb-admin ping` answers from the temporary server the image
          # runs while it initialises, and the real server restarts after that.
          # Wait on a query instead: it is true only once the server serves.
          for i in $(seq 1 60); do
            if docker exec mariadb mariadb -uroot -proot -e "SELECT 1;" >/dev/null 2>&1; then
              echo "mariadb is up"; break
            fi
            echo "waiting for mariadb... ($i)"; sleep 2
            if [ "$i" = 60 ]; then echo "mariadb never came up"; exit 1; fi
          done
          # Proof this job talks to MariaDB (version string carries "MariaDB").
          docker exec mariadb mariadb -uroot -proot -e "SELECT VERSION();"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (same MySQL suite, native round trip to MariaDB)
        env:
          MYSQL_TEST: "1"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"
          MYSQL_DB: "test"
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # MariaDB's client_ed25519 plugin. We create an account that authenticates VIA
  # ed25519 and run the same round trip as it: the server drives an
  # AuthSwitchRequest to client_ed25519 with a 32-byte nonce, and the driver signs
  # it with the password-keyed Ed25519 secret. A wrong signature fails the login,
  # so a green job proves the whole path.
  mariadb-ed25519:
    name: moonmysql (client_ed25519, live MariaDB 11)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/mysql
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start mariadb 11
        run: |
          docker run -d --name mariadb \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -e MARIADB_DATABASE=test \
            -p 3306:3306 \
            mariadb:11

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for mariadb and create an ed25519 account
        run: |
          # `mariadb-admin ping` answers from the temporary server the image
          # runs while it initialises, and the real server restarts after that.
          # Wait on a query instead: it is true only once the server serves.
          for i in $(seq 1 60); do
            if docker exec mariadb mariadb -uroot -proot -e "SELECT 1;" >/dev/null 2>&1; then
              echo "mariadb is up"; break
            fi
            echo "waiting for mariadb... ($i)"; sleep 2
            if [ "$i" = 60 ]; then echo "mariadb never came up"; exit 1; fi
          done
          docker exec mariadb mariadb -uroot -proot -e "INSTALL SONAME 'auth_ed25519';" || true
          docker exec mariadb mariadb -uroot -proot -e "CREATE USER 'edtest'@'%' IDENTIFIED VIA ed25519 USING PASSWORD('edpass'); GRANT ALL PRIVILEGES ON *.* TO 'edtest'@'%'; FLUSH PRIVILEGES;"
          docker exec mariadb mariadb -uroot -proot -e "SELECT user, plugin FROM mysql.user WHERE user='edtest';"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (round trip authenticating VIA client_ed25519)
        env:
          MYSQL_TEST: "1"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "edtest"
          MYSQL_PASSWORD: "edpass"
          MYSQL_DB: "test"
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # PostgreSQL over TLS: a self-signed certificate is generated on the runner and
  # mounted into the server; the client accepts it through the test's permissive
  # verifier. Exercises SSLRequest, the TLS handshake, SCRAM channel binding when
  # offered, and a bound round trip.
  postgres-tls:
    name: moonpostgres (live TLS PostgreSQL 16)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start postgres with TLS
        run: |
          mkdir -p /tmp/pgtls
          openssl req -new -x509 -days 1 -nodes -text \
            -out /tmp/pgtls/server.crt \
            -keyout /tmp/pgtls/server.key \
            -subj "/CN=localhost"
          chmod 644 /tmp/pgtls/server.crt
          chmod 600 /tmp/pgtls/server.key
          sudo chown 999:999 /tmp/pgtls/server.crt /tmp/pgtls/server.key
          docker run -d --name pgtls \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            -v /tmp/pgtls/server.crt:/var/lib/postgresql/server.crt:ro \
            -v /tmp/pgtls/server.key:/var/lib/postgresql/server.key:ro \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec pgtls pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres is up"; break
            fi
            echo "waiting for postgres... ($i)"; sleep 2
            if [ "$i" = 60 ]; then echo "postgres never came up"; exit 1; fi
          done

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (live TLS PostgreSQL)
        env:
          MOON_PG_TLS_TEST: "1"
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code


  # Servers that speak PostgreSQL's wire protocol but are not PostgreSQL. The same
  # driver carries the base contract on all of them, so the shared conformance matrix
  # is what runs here; the driver's own PostgreSQL tests cover COPY, LISTEN/NOTIFY and
  # server cursors, which these servers do not implement (see drivers/postgres/README.md).
  cockroachdb:
    name: moonckdb (native, live CockroachDB)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/ckdb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start CockroachDB
        run: |
          docker run -d --name crdb \
            -p 26257:26257 \
            cockroachdb/cockroach:v24.3.0 start-single-node --insecure

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for CockroachDB
        run: |
          for i in $(seq 1 60); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1;" >/dev/null 2>&1; then
              echo "cockroachdb is up"; break
            fi
            echo "waiting for cockroachdb... ($i)"; sleep 2
            if [ "$i" = 60 ]; then echo "cockroachdb never came up"; exit 1; fi
          done
          docker exec crdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS test;"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against live CockroachDB)
        env:
          CKDB_TEST: "1"
          CKDB_HOST: 127.0.0.1
          CKDB_PORT: "26257"
          CKDB_USER: root
          CKDB_PASSWORD: ""
          CKDB_DB: defaultdb
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  # An embedded analytical engine, loaded at run time: the job fetches the pinned
  # release rather than compiling a twenty-megabyte C++ amalgamation, which is also what
  # a user of this driver does.
  duckdb:
    name: moonduckdb (native, fetched engine)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/duckdb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: fetch the DuckDB engine
        run: |
          engine=$(sh scripts/fetch_engine.sh | tail -1)
          echo "MOONDUCKDB_LIBRARY=$engine" >> $GITHUB_ENV
          echo "engine: $engine"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against the real engine)
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  # An analytical engine, reached over its HTTP interface: no transactions, no
  # cursors, no prepared statements — the shared matrix records those as skipped and
  # asserts everything the contract does require.
  chdb:
    name: moonchdb (native, live ClickHouse)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/chdb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start ClickHouse
        run: |
          # The image disables network access for `default` unless a user is
          # provisioned, so the job creates one before the driver connects.
          docker run -d --name ch \
            -p 8123:8123 \
            -e CLICKHOUSE_USER=moonbit \
            -e CLICKHOUSE_PASSWORD=Moonbit2026 \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:24.8

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8123/ping >/dev/null 2>&1; then
              echo "clickhouse is up"; exit 0
            fi
            echo "waiting for clickhouse... ($i)"; sleep 2
          done
          docker logs ch | tail -20
          exit 1

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against live ClickHouse)
        env:
          CLICKHOUSE_TEST: "1"
          CLICKHOUSE_HOST: "127.0.0.1"
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: "moonbit"
          CLICKHOUSE_PASSWORD: "Moonbit2026"
          CLICKHOUSE_DB: "default"
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # SQL Server speaks a protocol of its own — TDS — with encryption negotiated inside
  # prelogin and parameters bound through an RPC to sp_executesql. The job starts a real
  # server and runs the shared matrix against it.
  sqls:
    name: moonsqls (native, live SQL Server 2022)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/sqls
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start SQL Server
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Moonbit!2026' \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for SQL Server
        run: |
          # The server initialises its system databases on first start; the tools ship
          # inside the image, so the wait probes with a real login.
          for i in $(seq 1 120); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                -S 127.0.0.1 -U sa -P 'Moonbit!2026' -C -Q "select 1" >/dev/null 2>&1; then
              echo "sql server is up"; exit 0
            fi
            echo "waiting for sql server... ($i)"; sleep 2
          done
          docker logs mssql | tail -30
          exit 1

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against live SQL Server)
        env:
          MSSQL_TEST: "1"
          MSSQL_HOST: "127.0.0.1"
          MSSQL_PORT: "1433"
          MSSQL_USER: "sa"
          MSSQL_PASSWORD: "Moonbit!2026"
          MSSQL_DB: "master"
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  # openGauss speaks PostgreSQL's wire protocol with its own authentication and a
  # narrower SQL surface. Same driver, same contract, so the shared matrix is what CI
  # checks here; the driver's PostgreSQL-only features (LISTEN/NOTIFY, DOMAIN,
  # ON CONFLICT) are not implemented by the server and are listed in its README.
  opengauss:
    name: moonpostgres (native, live openGauss)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start openGauss
        run: |
          docker run -d --name gauss --privileged=true --shm-size=1g \
            -e GS_PASSWORD=Moonbit@2026 \
            -p 55432:5432 \
            opengauss/opengauss-server:7.0.0-RC3.B025-amd64-openEuler22.03

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for openGauss
        run: |
          gsql() {
            docker exec -e GAUSSHOME=/usr/local/opengauss \
              -e LD_LIBRARY_PATH=/usr/local/opengauss/lib \
              -u omm gauss /usr/local/opengauss/bin/gsql -d postgres -p 5432 "$@"
          }
          # The server answers SQL only once it has finished initialising the data
          # directory, which takes about a minute in this image.
          for i in $(seq 1 90); do
            if gsql -tAc "select 1" >/dev/null 2>&1; then
              echo "opengauss is up"
              break
            fi
            echo "waiting for opengauss... ($i)"; sleep 2
            if [ "$i" = 90 ]; then docker logs gauss | tail -20; exit 1; fi
          done
          # openGauss refuses a remote login by its initial user, so the job creates
          # an ordinary role for the driver to authenticate as.
          gsql -c "CREATE USER moonbit WITH PASSWORD 'Moonbit@2026'"
          gsql -c "GRANT ALL PRIVILEGES TO moonbit"
          gsql -c "GRANT CREATE ON SCHEMA public TO moonbit"

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against live openGauss)
        env:
          MOON_PG_TEST: "1"
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGUSER: moonbit
          PGPASSWORD: "Moonbit@2026"
          PGDATABASE: postgres
        run: moon test --target native src/conformance_integration_wbtest.mbt

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  # The other MySQL-compatible server, from a different lineage: TiDB speaks the
  # protocol and SQL of MySQL but implements neither of MySQL's two big features the
  # driver also offers (no COPY, no server cursor), and its own dialect on top. Same
  # protocol, same contract — so the same conformance matrix.
  tidb:
    name: moontidb (native, live TiDB)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: drivers/tidb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: start TiDB
        run: |
          docker run -d --name tidb \
            -p 4000:4000 -p 10080:10080 \
            pingcap/tidb:v8.5.0 --store=mocktikv --path='' --host=0.0.0.0

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: wait for TiDB
        run: |
          # 10080 is TiDB's status port; it answers only once the server serves SQL.
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:10080/status >/dev/null 2>&1; then
              echo "tidb is up"; break
            fi
            echo "waiting for tidb... ($i)"; sleep 2
            if [ "$i" = 90 ]; then docker logs tidb; exit 1; fi
          done

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (the shared matrix against live TiDB)
        env:
          TIDB_TEST: "1"
          TIDB_HOST: "127.0.0.1"
          TIDB_PORT: "4000"
          TIDB_USER: "root"
          TIDB_PASSWORD: ""
          TIDB_DB: "test"
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code
